{% extends "base.html" %}
{% block title %}Profile | FretFlow{% endblock %}
{% block content %}
<section class="auth-card profile-card">
    <p class="eyebrow">Your account</p>
    <h1>Profile settings</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="primary-button">Save changes</button>
    </form>
    <p><a href="{% url 'accounts:dashboard' %}">Back to dashboard</a></p>
</section>
{% endblock %}
